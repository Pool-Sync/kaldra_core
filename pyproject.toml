[project]
name = "kaldra-monorepo"
version = "0.1.0"
description = "KALDRA Monorepo Root - Unicorn Standard"
requires-python = ">=3.11"
dependencies = [
    "kaldra-engine",
]

[dependency-groups]
dev = [
    "ruff>=0.1.0",
    "pyright>=1.1.3",
    "pytest>=7.4.0",
    "pre-commit>=3.5.0",
    "httpx>=0.25.0",
]

[tool.uv.sources]
kaldra-engine = { path = "packages/engine", editable = true }

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E402",  # Module level import not at top of file (common in scripts)
    "E501",  # Line too long (comments/docstrings acceptable)
    "E722",  # Bare except (acceptable for simple fallbacks like JSON parsing)
    "B008",  # FastAPI Depends() in function defaults is standard pattern
    "B017",  # pytest.raises(Exception) acceptable in test failover scenarios
    "B904",  # raise ... from e (not critical for v3)
    "UP007", # Union[X, Y] vs X | Y (legacy code compatibility)
]

[tool.pyright]
include = ["packages/engine", "apps/api"]
exclude = ["**/__pycache__", "**/archive", "apps/web", "**/legacy", "**/old"]
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
# Ignoring "Import could not be resolved" for known missing standard libs or tricky paths if needed
# but better to fix env.

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --ignore=tests/legacy"
testpaths = [
    "tests",
]
python_files = "test_*.py"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
