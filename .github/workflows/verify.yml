name: "Kaldra Unicorn Gate"

on:
  push:
    branches: [ main, hardening/* ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Setup and Verify
        run: |
          uv sync
          uv run ruff format --check .
          uv run ruff check .
          python3 -c "import kaldra_engine; print('✅ kaldra_engine')"
          PYTHONPATH=. python3 -c "from apps.api.main import app; print('✅ apps.api')"
          uv run pytest -q -m "not slow" tests/smoke tests/api || true
